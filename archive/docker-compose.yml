services:
  readback:
    build: .
    image: readback:latest
    container_name: readback
    ports:
      - "4321:80"          # LAN access: http://<your-ip>:4321
    restart: unless-stopped

  # Cloudflare Tunnel — publishes the site at readback.ca without opening
  # any router ports and without exposing your home IP.
  # Token lives in .env (gitignored). See docs/cloudflare-tunnel.md.
  # Comment this service out if you only want LAN access.
  # Behind a profile so plain `docker compose up -d` runs the site alone.
  # Start the tunnel with:  docker compose --profile tunnel up -d
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: readback-tunnel
    command: tunnel --no-autoupdate run
    environment:
      # Set this in .env — see docs/cloudflare-tunnel.md. Empty default so
      # the site can start without it; cloudflared errors clearly if unset.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - readback
    restart: unless-stopped
