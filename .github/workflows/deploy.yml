name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, staging]
  workflow_run:
    workflows: ["Refresh data and news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # manual pushes always run; after the data-refresh run, only deploy if it succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # main -> production (readback.ofrecord.ca); staging -> preview (staging.readback-bpq.pages.dev)
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=readback --branch=${{ github.ref_name }} --commit-dirty=true
